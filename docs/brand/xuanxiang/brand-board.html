<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>悬象 · 品牌初稿</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#e9e2d7;color:#211f1b}
    body{font-family:"Songti SC","STSong",serif;padding:64px}
    main{width:1472px;min-height:1072px;margin:auto;background:#f5f0e7;border-radius:32px;overflow:hidden;box-shadow:0 30px 80px #3c332526}
    header{height:520px;padding:72px 86px;display:grid;grid-template-columns:1.4fr .6fr;align-items:center;border-bottom:1px solid #d7cec1}
    .primary img{width:760px;display:block}.primary p{margin:34px 0 0 290px;color:#716b61;font:24px/1.7 "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.03em}
    .idea{align-self:stretch;display:flex;flex-direction:column;justify-content:center;border-left:1px solid #d7cec1;padding-left:56px}
    .idea b{font:700 15px/1.2 ui-monospace,monospace;letter-spacing:.18em;color:#a45137}.idea h1{font-size:42px;margin:20px 0 18px}.idea p{font:20px/1.8 "PingFang SC","Microsoft YaHei",sans-serif;color:#716b61;margin:0}
    .samples{display:grid;grid-template-columns:1fr 1fr 1fr;height:400px}
    .sample{padding:54px;display:flex;flex-direction:column;justify-content:center;align-items:center;border-right:1px solid #d7cec1}.sample:last-child{border:0}.sample img{max-width:100%;max-height:230px}.sample.dark{background:#253a35}.sample.app img{width:245px}.sample label{margin-top:26px;font:700 14px/1 ui-monospace,monospace;letter-spacing:.16em;color:#716b61}.sample.dark label{color:#d7a452}
    footer{height:152px;padding:34px 70px;display:flex;align-items:center;justify-content:space-between;background:#fffdfa;font:17px/1.7 "PingFang SC","Microsoft YaHei",sans-serif;color:#716b61}
    .swatches{display:flex;gap:14px}.swatch{width:52px;height:52px;border-radius:50%;border:5px solid #fff;box-shadow:0 0 0 1px #0002}.pine{background:#253a35}.rust{background:#a45137}.gold{background:#d7a452}.paper{background:#f5f0e7}
  </style>
</head>
<body>
<main>
  <header>
    <section class="primary">
      <img src="xuanxiang-logo-horizontal.svg" alt="悬象横版 Logo">
      <p>星辰天象，亘古长悬。<br>让一个想法成为一个持续生长的世界。</p>
    </section>
    <section class="idea">
      <b>CONCEPT 01</b>
      <h1>悬星浑仪</h1>
      <p>断开的天球轨道代表开放、演化的世界引擎；斜向浑仪代表运行与编译；中心星火同时是创意种子与故事熔炉。</p>
    </section>
  </header>
  <section class="samples">
    <div class="sample app"><img src="xuanxiang-logo-upload.svg" alt="企业展示图标"><label>LOBBY / PROFILE</label></div>
    <div class="sample dark"><img src="xuanxiang-logo-horizontal-dark.svg" alt="深色版 Logo"><label>DARK BACKGROUND</label></div>
    <div class="sample"><img src="xuanxiang-storyforge-lockup.svg" alt="悬象与 StoryForge 联合标识"><label>PRODUCT LOCKUP</label></div>
  </section>
  <footer>
    <span>品牌母体：悬象 XUANXIANG　·　核心产品：StoryForge 故事熔炉</span>
    <div class="swatches"><i class="swatch pine"></i><i class="swatch rust"></i><i class="swatch gold"></i><i class="swatch paper"></i></div>
  </footer>
</main>
</body>
</html>
